<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="demos.pageTitle">Gönderilerim · AFTER/FORM</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/ibm-plex-mono/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/portal.css">
    <script type="module" src="/js/pages/portal-demos.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">İçeriğe geç</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1">
      <section class="container page-head page-head--split" aria-labelledby="demos-title">
        <div>
          <p class="eyebrow"><span class="eyebrow__index">01</span><span data-i18n="common.areas.artist">Sanatçı portalı</span></p>
          <h1 class="page-head__title" id="demos-title" data-i18n="demos.title">Gönderilerim</h1>
          <p class="page-head__lead" data-i18n="demos.lead">Yüklediğin demolar ve değerlendirme durumları burada listelenir.</p>
        </div>
        <a class="btn btn--primary" href="/portal/upload.html" data-i18n="demos.uploadAction">Demo yükle</a>
      </section>
      <section class="container list" aria-labelledby="demos-results-title">
        <h2 class="visually-hidden" id="demos-results-title" tabindex="-1" data-i18n="demos.results">Demolar</h2>
        <form class="list-controls" data-controls>
          <div class="field">
            <label class="field__label" for="filter-status" data-i18n="demos.filters.status">Durum</label>
            <select class="select" id="filter-status" name="status"></select>
          </div>
          <div class="field">
            <label class="field__label" for="filter-sort" data-i18n="demos.filters.sort">Sıralama</label>
            <select class="select" id="filter-sort" name="sort"></select>
          </div>
        </form>
        <p class="list-summary" role="status" data-summary></p>
        <div class="list-results" data-results aria-busy="true">
          <p class="visually-hidden" data-i18n="demos.loading">Demolar yükleniyor…</p>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
