<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="demos.pageTitle">Gönderilerim · AFTER/FORM</title>
    <meta name="color-scheme" content="dark light">
    <script src="/js/theme-boot.js"></script>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/ibm-plex-mono/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/portal.css">
    <script type="module" src="/js/pages/portal-demos.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">İçeriğe geç</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1">
      <section class="scene-head scene-head--demos" aria-labelledby="demos-title" data-scene-head>
        <div class="scene-head__media" aria-hidden="true">
          <picture>
            <source media="(max-width: 639px)" type="image/avif" srcset="/assets/photos/wall-tall-720.avif 720w, /assets/photos/wall-tall-1080.avif 1080w" sizes="100vw">
            <source type="image/avif" srcset="/assets/photos/wall-wide-1280.avif 1280w, /assets/photos/wall-wide-1920.avif 1920w, /assets/photos/wall-wide-2560.avif 2560w" sizes="100vw">
            <img class="scene-head__img" src="/assets/photos/wall-wide-1920.webp" alt="" width="1920" height="1200" fetchpriority="high">
          </picture>
        </div>
        <div class="container scene-head__inner demos-head">
          <div class="demos-head__copy">
            <p class="scene-head__eyebrow enter">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#microphone"></use></svg>
              <span data-i18n="common.areas.artist">Sanatçı portalı</span>
            </p>
            <h1 class="scene-head__title enter enter-2" id="demos-title" data-i18n="demos.title">Gönderilerim</h1>
            <p class="scene-head__lead enter enter-3" data-i18n="demos.lead">Yüklediğin demolar ve değerlendirme durumları burada listelenir.</p>
          </div>
          <a class="btn btn--primary demos-head__cta enter enter-3" href="/portal/upload.html"><span data-i18n="demos.uploadAction">Demo yükle</span><svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#arrow-up-right"></use></svg></a>
          <div class="demo-stats enter enter-4" role="group" aria-labelledby="filter-status-label" data-stats>
            <p class="visually-hidden" id="filter-status-label" data-i18n="demos.filters.status">Durum</p>
            <button class="demo-stat" type="button" aria-pressed="true" data-status="">
              <span class="demo-stat__label"><span data-i18n="demos.filters.all">Tümü</span></span>
              <span class="demo-stat__count" data-count>–</span>
            </button>
            <button class="demo-stat demo-stat--pending" type="button" aria-pressed="false" data-status="pending">
              <span class="demo-stat__label"><svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#status-pending"></use></svg><span data-i18n="status.pending">Beklemede</span></span>
              <span class="demo-stat__count" data-count>–</span>
            </button>
            <button class="demo-stat demo-stat--in_review" type="button" aria-pressed="false" data-status="in_review">
              <span class="demo-stat__label"><svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#status-in_review"></use></svg><span data-i18n="status.in_review">İnceleniyor</span></span>
              <span class="demo-stat__count" data-count>–</span>
            </button>
            <button class="demo-stat demo-stat--accepted" type="button" aria-pressed="false" data-status="accepted">
              <span class="demo-stat__label"><svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#status-accepted"></use></svg><span data-i18n="status.accepted">Kabul edildi</span></span>
              <span class="demo-stat__count" data-count>–</span>
            </button>
            <button class="demo-stat demo-stat--rejected" type="button" aria-pressed="false" data-status="rejected">
              <span class="demo-stat__label"><svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#status-rejected"></use></svg><span data-i18n="status.rejected">Reddedildi</span></span>
              <span class="demo-stat__count" data-count>–</span>
            </button>
          </div>
        </div>
      </section>
      <section class="container list demos-list" aria-labelledby="demos-results-title">
        <h2 class="visually-hidden" id="demos-results-title" tabindex="-1" data-i18n="demos.results">Demolar</h2>
        <div class="demos-bar">
          <p class="list-summary demos-bar__summary" role="status" data-summary></p>
          <form class="list-controls demos-bar__controls" data-controls>
            <div class="field field--inline">
              <label class="field__label" for="filter-sort" data-i18n="demos.filters.sort">Sıralama</label>
              <select class="select" id="filter-sort" name="sort"></select>
            </div>
          </form>
        </div>
        <div class="list-results" data-results aria-busy="true">
          <p class="visually-hidden" data-i18n="demos.loading">Demolar yükleniyor…</p>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
