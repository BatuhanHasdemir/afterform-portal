<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="auth.login.pageTitle">Giriş yap · AFTER/FORM</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/ibm-plex-mono/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
    <script type="module" src="/js/pages/login.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">İçeriğe geç</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1">
      <div class="container auth">
        <p class="eyebrow" data-i18n="common.areas.artist">Sanatçı portalı</p>
        <h1 class="auth__title" id="login-title" data-i18n="auth.login.title">Giriş yap</h1>
        <p class="auth__lead" data-i18n="auth.login.lead">Demolarını ve değerlendirme durumlarını görmek için giriş yap.</p>
        <p class="notice" role="status" data-status></p>
        <form class="form-stack auth__form" id="login-form" aria-labelledby="login-title" novalidate>
          <div class="field">
            <label class="field__label" for="login-email" data-i18n="auth.fields.email">E-posta adresi</label>
            <input class="input" id="login-email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="field">
            <label class="field__label" for="login-password" data-i18n="auth.fields.password">Parola</label>
            <div class="input-group">
              <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
              <button class="input-group__button" type="button" aria-controls="login-password" aria-pressed="false" aria-label="Parolayı göster" data-password-toggle data-i18n="auth.password.show" data-i18n-attr="aria-label:auth.password.showLabel">Göster</button>
            </div>
          </div>
          <p class="countdown" data-lock hidden>
            <span id="login-timer-label" data-i18n="auth.login.timer">Tekrar denemeden önce kalan süre:</span>
            <span class="countdown__time" role="timer" aria-labelledby="login-timer-label" data-lock-timer>0:00</span>
          </p>
          <button class="btn btn--primary auth__submit" type="submit" data-i18n="auth.login.submit">Giriş yap</button>
        </form>
        <ul class="auth__links" role="list">
          <li><a href="/forgot-password.html" data-i18n="auth.login.forgot">Parolanı mı unuttun?</a></li>
          <li><span data-i18n="auth.login.noAccount">Hesabın yok mu?</span> <a href="/register.html" data-register-link data-i18n="auth.login.register">Kayıt ol</a></li>
        </ul>
        <div data-info-card></div>
      </div>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
