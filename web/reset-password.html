<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title data-i18n="auth.reset.pageTitle">Yeni parola · AFTER/FORM</title>
    <meta name="color-scheme" content="dark light">
    <script src="/js/theme-boot.js"></script>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/ibm-plex-mono/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
    <script type="module" src="/js/pages/reset-password.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">İçeriğe geç</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1">
      <div class="container auth">
        <p class="eyebrow" data-i18n="common.areas.artist">Sanatçı portalı</p>
        <h1 class="auth__title" id="reset-title" data-i18n="auth.reset.title">Yeni parola belirle</h1>
        <div data-request>
          <p class="auth__lead" data-i18n="auth.reset.lead">Hesabın için yeni bir parola seç.</p>
          <form class="form-stack auth__form" id="reset-form" aria-labelledby="reset-title" novalidate>
            <div class="field">
              <label class="field__label" for="reset-email" data-i18n="auth.fields.email">E-posta adresi</label>
              <input class="input" id="reset-email" name="username" type="email" autocomplete="username" readonly>
            </div>
            <div class="field">
              <label class="field__label" for="reset-password" data-i18n="auth.fields.newPassword">Yeni parola</label>
              <p class="field__hint" id="reset-password-hint" data-i18n="auth.hints.password">En az 12 karakter. Kolay hatırladığın uzun bir cümle iyi bir parola olur.</p>
              <div class="input-group">
                <input class="input" id="reset-password" name="newPassword" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false" aria-describedby="reset-password-hint reset-password-strength" required>
                <button class="input-group__button" type="button" aria-controls="reset-password" aria-pressed="false" aria-label="Parolayı göster" data-password-toggle data-i18n="auth.password.show" data-i18n-attr="aria-label:auth.password.showLabel">Göster</button>
              </div>
              <div class="password-meter" id="reset-password-strength" data-level="empty">
                <span class="password-meter__bar" aria-hidden="true"><span></span><span></span><span></span></span>
                <span class="password-meter__text" data-strength-text></span>
              </div>
            </div>
            <button class="btn btn--primary auth__submit" type="submit" data-i18n="auth.reset.submit">Parolayı güncelle</button>
          </form>
        </div>
        <div class="auth__panel" data-invalid hidden>
          <h2 class="auth__panel-title" tabindex="-1" data-i18n="auth.reset.invalidTitle">Bu bağlantı kullanılamıyor</h2>
          <p data-i18n="errors.auth.reset_token_invalid">Bu sıfırlama bağlantısı geçersiz ya da süresi dolmuş. Yeni bir bağlantı iste.</p>
          <div class="actions">
            <a class="btn btn--primary" href="/forgot-password.html" data-i18n="auth.reset.requestNew">Yeni bağlantı iste</a>
          </div>
        </div>
      </div>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
