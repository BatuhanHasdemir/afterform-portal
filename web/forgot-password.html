<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="auth.forgot.pageTitle">Parolamı unuttum · AFTER/FORM</title>
    <meta name="color-scheme" content="dark light">
    <script src="/js/theme-boot.js"></script>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/archivo/archivo-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/ibm-plex-mono/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
    <script type="module" src="/js/pages/forgot-password.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="common.skipToContent">İçeriğe geç</a>
    <header id="site-header"></header>
    <main id="main" tabindex="-1">
      <div class="container auth">
        <p class="eyebrow" data-i18n="common.areas.artist">Sanatçı portalı</p>
        <h1 class="auth__title" id="forgot-title" data-i18n="auth.forgot.title">Parolamı unuttum</h1>
        <div data-request>
          <p class="auth__lead" data-i18n="auth.forgot.lead">Hesabının e-posta adresini yaz. Kayıtlıysa bu adrese bir sıfırlama bağlantısı gönderilir.</p>
          <form class="form-stack auth__form" id="forgot-form" aria-labelledby="forgot-title" novalidate>
            <div class="field">
              <label class="field__label" for="forgot-email" data-i18n="auth.fields.email">E-posta adresi</label>
              <input class="input" id="forgot-email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
            </div>
            <button class="btn btn--primary auth__submit" type="submit" data-i18n="auth.forgot.submit">Bağlantı gönder</button>
          </form>
        </div>
        <div class="auth__panel" data-sent hidden>
          <h2 class="auth__panel-title" tabindex="-1" data-i18n="auth.forgot.sentTitle">İsteğin alındı</h2>
          <p data-i18n="auth.forgot.sent">Bu e-posta kayıtlıysa sıfırlama bağlantısı gönderildi.</p>
        </div>
        <ul class="auth__links" role="list">
          <li><a href="/login.html" data-i18n="auth.forgot.back">Girişe dön</a></li>
        </ul>
      </div>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
