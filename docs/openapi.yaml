# Kaynak: dev-mock/openapi.mjs. Değişiklik orada yapılır; bu dosyayı `npm run openapi` yeniden yazar.
openapi: "3.1.0"
info:
  title: "AFTER/FORM Sanatçı Portalı API"
  version: "0.1.0"
  description: "docs/ARCHITECTURE.md §7. JSON UTF-8, alan adları camelCase, tarihler ISO-8601 UTC. Hata gövdesi yalnızca `code` (ve gerekirse `fields`, `retryAfterSeconds`) taşır; serbest metin yoktur. Bilinmeyen `/api` yolu 404 `not_found`, sunucu hatası 5xx `server.error` döner. Tüm yanıtlar `Cache-Control: no-store` taşır."
servers:
  - url: "/api"
    description: "Uygulamayla aynı origin."
tags:
  - name: auth
    description: "Oturum, kayıt ve parola."
  - name: demos
    description: "Sanatçının kendi demoları."
  - name: admin
    description: "Yönetici: tüm demolar ve değerlendirme."
paths:
  "/csrf":
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: "CSRF belirteci (ve ona bağlı çerez)"
      security: []
      responses:
        "200":
          description: "Belirteç."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CsrfToken"
  "/me":
    get:
      tags: [auth]
      operationId: getMe
      summary: "Oturumdaki kullanıcı"
      security:
        - session: []
      responses:
        "200":
          description: "Kullanıcı."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        "401":
          description: "Oturum yok veya süresi doldu."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.unauthenticated]
  "/auth/register":
    post:
      tags: [auth]
      operationId: register
      summary: "Sanatçı hesabı aç"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "Hesap açıldı; otomatik giriş yapılmaz."
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0
        "400":
          description: "Alan hataları `fields` içinde. Belirteç yok veya eskiyse csrf.invalid."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [validation.failed, csrf.invalid]
        "409":
          description: "E-posta kullanımda. Backend bunun yerine her zaman 201 de dönebilir (§7 dipnot 1)."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.email_taken]
      parameters:
        - "$ref": "#/components/parameters/CsrfToken"
  "/auth/login":
    post:
      tags: [auth]
      operationId: login
      summary: "Giriş; oturum çerezi yenilenir, CSRF belirteci geçersizleşir"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Giriş yapıldı."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponse"
        "400":
          description: "E-posta veya parola boş. Belirteç yok veya eskiyse csrf.invalid."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [validation.failed, csrf.invalid]
        "401":
          description: "E-posta veya parola hatalı; hangisi olduğu söylenmez."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.invalid_credentials]
        "429":
          description: "Aynı e-posta için 5. başarısız denemeden sonra 15 dakika bekleme (e-posta kayıtlı olmasa da) ya da IP başına dakikada 10 istek sınırı."
          headers:
            Retry-After:
              description: "Beklenecek süre, saniye."
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.too_many_attempts]
      parameters:
        - "$ref": "#/components/parameters/CsrfToken"
  "/auth/logout":
    post:
      tags: [auth]
      operationId: logout
      summary: "Çıkış; CSRF belirteci geçersizleşir"
      security: []
      responses:
        "204":
          description: "Oturum kapandı (yoksa da)."
        "400":
          description: "CSRF belirteci yok veya eski."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [csrf.invalid]
      parameters:
        - "$ref": "#/components/parameters/CsrfToken"
  "/auth/forgot-password":
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: "Parola sıfırlama bağlantısı iste"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: "E-posta kayıtlı olsun olmasın aynı yanıt."
        "400":
          description: "CSRF belirteci yok veya eski."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [csrf.invalid]
        "429":
          description: "IP başına 15 dakikada 5 istek sınırı."
          headers:
            Retry-After:
              description: "Beklenecek süre, saniye."
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [rate.limited]
      parameters:
        - "$ref": "#/components/parameters/CsrfToken"
  "/auth/reset-password":
    post:
      tags: [auth]
      operationId: resetPassword
      summary: "Bağlantıdaki belirteçle yeni parola belirle"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: "Parola değişti; kullanıcının açık oturumları kapandı."
        "400":
          description: "Belirteç geçersiz, kullanılmış veya süresi dolmuş; ya da yeni parola kurala uymuyor. Belirteç yok veya eskiyse csrf.invalid."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.reset_token_invalid, validation.failed, csrf.invalid]
      parameters:
        - "$ref": "#/components/parameters/CsrfToken"
  "/demos":
    get:
      tags: [demos]
      operationId: listDemos
      summary: "Sanatçının kendi demoları"
      security:
        - session: []
      parameters:
        - name: status
          in: query
          schema:
            "$ref": "#/components/schemas/Status"
        - name: sort
          in: query
          schema:
            "$ref": "#/components/schemas/SortOrder"
          description: "Varsayılan `newest`."
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Bir sayfa demo."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DemoPage"
        "400":
          description: "Geçersiz süzgeç, sıralama veya sayfa değeri."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [validation.failed]
        "401":
          description: "Oturum yok veya süresi doldu."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.unauthenticated]
    post:
      tags: [demos]
      operationId: uploadDemo
      summary: "Demo yükle"
      description: "Yalnızca MP3, en fazla 100000000 bayt. Biçimi uzantı (`.mp3`) ve dosyanın ilk baytları (ID3v2 etiketi ya da MPEG Layer III çerçeve başlığı) belirler; istemcinin bildirdiği tür belirleyici değildir. Alan hataları biçimden önce denetlenir. SHA-256 özeti dosya okunurken hesaplanır."
      security:
        - session: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/DemoUpload"
      responses:
        "201":
          description: "Kayıt oluştu."
          headers:
            Location:
              description: "`/api/demos/{id}`"
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Demo"
        "400":
          description: "Alan hataları `fields` içinde. Belirteç yok veya eskiyse csrf.invalid."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [validation.failed, csrf.invalid]
        "401":
          description: "Oturum yok veya süresi doldu."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.unauthenticated]
        "413":
          description: "Dosya sınırdan büyük; okuma sırasında kesilir."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [upload.too_large]
        "415":
          description: "Dosya MP3 değil."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [upload.unsupported_type]
      parameters:
        - "$ref": "#/components/parameters/CsrfToken"
  "/demos/{id}":
    get:
      tags: [demos]
      operationId: getDemo
      summary: "Tek demo (sahibi ya da yönetici)"
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Demo.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Demo"
        "401":
          description: "Oturum yok veya süresi doldu."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.unauthenticated]
        "404":
          description: "Kayıt yok ya da başkasına ait; ikisi aynı yanıtı alır."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [demo.not_found]
  "/demos/{id}/audio":
    get:
      tags: [demos]
      operationId: getDemoAudio
      summary: "Ses dosyası; `Range` desteklenir"
      description: "Sahibine ve yöneticiye açıktır. `Cache-Control: private, no-store` ve `X-Content-Type-Options: nosniff` taşır."
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          schema:
            type: string
          example: "bytes=0-1023"
      responses:
        "200":
          description: "Dosyanın tamamı."
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: "İstenen aralık."
          headers:
            Content-Range:
              schema:
                type: string
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "401":
          description: "Oturum yok veya süresi doldu."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.unauthenticated]
        "404":
          description: "Kayıt yok ya da başkasına ait; ikisi aynı yanıtı alır."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [demo.not_found]
        "416":
          description: "Aralık dosyanın dışında."
  "/admin/demos":
    get:
      tags: [admin]
      operationId: listAllDemos
      summary: "Tüm demolar, sanatçısıyla"
      security:
        - session: []
      parameters:
        - name: status
          in: query
          schema:
            "$ref": "#/components/schemas/Status"
        - name: sort
          in: query
          schema:
            "$ref": "#/components/schemas/SortOrder"
          description: "Varsayılan `newest`."
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          schema:
            type: string
          description: "Parça veya sanatçı adında; büyük/küçük harf ve aksan duyarsız."
      responses:
        "200":
          description: "Bir sayfa demo."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminDemoPage"
        "400":
          description: "Geçersiz süzgeç, sıralama veya sayfa değeri."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [validation.failed]
        "401":
          description: "Oturum yok veya süresi doldu."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.unauthenticated]
        "403":
          description: "Rol yetersiz."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.forbidden]
  "/admin/demos/{id}":
    get:
      tags: [admin]
      operationId: getAnyDemo
      summary: "Tek demo, sanatçısıyla"
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Demo.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminDemo"
        "401":
          description: "Oturum yok veya süresi doldu."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.unauthenticated]
        "403":
          description: "Rol yetersiz."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.forbidden]
        "404":
          description: "Kayıt yok ya da başkasına ait; ikisi aynı yanıtı alır."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [demo.not_found]
  "/admin/demos/{id}/status":
    patch:
      tags: [admin]
      operationId: changeDemoStatus
      summary: "Değerlendirme durumunu değiştir"
      description: "`statusNote` gönderilmezse veya boşsa `null` olur; önceki not yeni duruma taşınmaz."
      security:
        - session: []
      parameters:
        - "$ref": "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StatusChange"
      responses:
        "200":
          description: "Güncel kayıt."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminDemo"
        "400":
          description: "Alan hataları `fields` içinde. Belirteç yok veya eskiyse csrf.invalid."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [validation.failed, csrf.invalid]
        "401":
          description: "Oturum yok veya süresi doldu."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.unauthenticated]
        "403":
          description: "Rol yetersiz."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [auth.forbidden]
        "404":
          description: "Kayıt yok ya da başkasına ait; ikisi aynı yanıtı alır."
          content:
            application/json:
              schema:
                allOf:
                  - "$ref": "#/components/schemas/ErrorBody"
                  - properties:
                      code:
                        enum: [demo.not_found]
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: af_session
      description: "`HttpOnly`, `SameSite=Lax` (HTTPS’te `Secure`) oturum çerezi. Adı sunucuya bağlıdır; frontend çerezi hiç okumaz."
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: "`GET /api/csrf` ile alınan belirteç; giriş ve çıkışta geçersizleşir."
      schema:
        type: string
  schemas:
    Status:
      type: string
      enum: [pending, in_review, accepted, rejected]
    Genre:
      type: string
      enum: [electronic, hiphop, pop, rock, ambient, jazz, experimental, other]
    SortOrder:
      type: string
      enum: [newest, oldest, updated, title]
    Role:
      type: string
      enum: [artist, admin]
    FieldErrorCode:
      type: string
      enum: [required, too_short, too_long, invalid_format, invalid_value]
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items:
              "$ref": "#/components/schemas/FieldErrorCode"
        retryAfterSeconds:
          type: integer
          minimum: 1
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
        email:
          type: string
          maxLength: 254
        displayName:
          type: string
          minLength: 2
          maxLength: 60
        role:
          "$ref": "#/components/schemas/Role"
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          "$ref": "#/components/schemas/User"
    DemoFile:
      type: object
      additionalProperties: false
      required: [originalName, sizeBytes, contentType, sha256]
      properties:
        originalName:
          type: string
          minLength: 1
          maxLength: 255
          description: "Yalnızca metin olarak gösterilir."
        sizeBytes:
          type: integer
          minimum: 1
        contentType:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    Demo:
      type: object
      additionalProperties: false
      required: [id, title, genre, note, status, statusNote, createdAt, updatedAt, file]
      properties:
        id:
          type: string
          description: "Frontend için opak."
        title:
          type: string
          minLength: 1
          maxLength: 120
        genre:
          "$ref": "#/components/schemas/Genre"
        note:
          type: string
          maxLength: 1000
        status:
          "$ref": "#/components/schemas/Status"
        statusNote:
          type: [string, "null"]
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        file:
          "$ref": "#/components/schemas/DemoFile"
    AdminDemo:
      type: object
      additionalProperties: false
      required: [id, title, genre, note, status, statusNote, createdAt, updatedAt, file, artist]
      properties:
        id:
          type: string
          description: "Frontend için opak."
        title:
          type: string
          minLength: 1
          maxLength: 120
        genre:
          "$ref": "#/components/schemas/Genre"
        note:
          type: string
          maxLength: 1000
        status:
          "$ref": "#/components/schemas/Status"
        statusNote:
          type: [string, "null"]
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        file:
          "$ref": "#/components/schemas/DemoFile"
        artist:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id:
              type: string
            displayName:
              type: string
              minLength: 2
              maxLength: 60
    DemoPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Demo"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    AdminDemoPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/AdminDemo"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 60
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    ResetPasswordRequest:
      type: object
      required: [email, token, newPassword]
      properties:
        email:
          type: string
        token:
          type: string
        newPassword:
          type: string
          minLength: 12
